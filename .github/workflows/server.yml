name: server

# Path-filtered so the Node pipeline never runs for a desktop-only change, and
# vice versa. This is what makes one repository holding several toolchains
# practical (D6 in the roadmap).
on:
  push:
    branches: [main, dev]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

# Least privilege: this workflow only reads the code. Without an explicit block
# the job inherits the repository default, which may include write scopes it has
# no use for.
permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node version — the same file nvm
          # reads locally, so CI cannot drift from a developer's machine.
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      # ci, not install: installs exactly the committed lockfile and fails if
      # package.json and the lockfile disagree.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # D1: the dependency tree is the attack surface in this ecosystem, so a
      # high-severity advisory should stop a merge rather than sit in a report
      # nobody reads. Moderate and below do not fail the build.
      - name: Audit
        run: npm audit --audit-level=high

  # Applies the migrations against a real PostgreSQL. The unit tests stub the
  # pool and never touch a database, so without this a broken migration would
  # reach main unnoticed and only fail on someone's machine.
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches the production target (postgresql@16 locally).
        image: postgres:16
        env:
          POSTGRES_USER: bookworm
          POSTGRES_PASSWORD: bookworm
          POSTGRES_DB: bookworm_ci
        ports:
          - 5432:5432
        # Without a health check the job races the container and fails
        # intermittently on a connection refused.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://bookworm:bookworm@localhost:5432/bookworm_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npx node-pg-migrate up

      - name: Verify the expected tables exist
        run: |
          psql "$DATABASE_URL" -qtA -c "
            SELECT string_agg(tablename, ',' ORDER BY tablename)
            FROM pg_tables
            WHERE schemaname = 'public' AND tablename <> 'pgmigrations';
          " | grep -qx 'book_tags,books,challenges,covers,favorite_quotes,highlights,reading_sessions,refresh_tokens,tags,users' \
            || { echo 'Unexpected set of tables after migration'; exit 1; }

          # The list above is deliberately exact rather than a subset check:
          # adding a table should be an explicit act declared here, not
          # something that slips in unnoticed.

      # Ownership is only real if the columns are NOT NULL. A nullable user_id
      # would let an un-owned row exist, which is the thing this phase exists to
      # make impossible.
      - name: Verify ownership is enforced
        run: |
          psql "$DATABASE_URL" -qtA -c "
            SELECT count(*) FROM information_schema.columns
            WHERE table_name IN ('books','tags','challenges','reading_sessions')
              AND column_name = 'user_id' AND is_nullable = 'NO';
          " | grep -qx '4' || { echo 'user_id is not NOT NULL on all four tables'; exit 1; }

      # The key that makes session sync idempotent and order-independent. If a
      # later migration widens it to include user_id, two clients pushing the
      # same session stop converging - so it is pinned here.
      - name: Verify the session merge key is intact
        run: |
          psql "$DATABASE_URL" -qtA -c "
            SELECT pg_get_constraintdef(oid) FROM pg_constraint
            WHERE conrelid = 'reading_sessions'::regclass AND contype = 'u';
          " | grep -qx 'UNIQUE (book_id, session_date, source)' \
            || { echo 'reading_sessions unique constraint changed'; exit 1; }

      - name: Seed an account
        env:
          SEED_EMAIL: ci@example.test
          SEED_PASSWORD: ci-throwaway-password
        run: |
          npm run seed:user
          psql "$DATABASE_URL" -qtA -c 'SELECT count(*) FROM users;' | grep -qx '1' \
            || { echo 'Expected exactly one account'; exit 1; }

      # Most of the suite stubs the pool, but the auth tests need a real
      # PostgreSQL: rotation and reuse detection are a transaction, a FOR UPDATE
      # lock and a bulk revoke, and a stub would only prove the code calls the
      # queries it calls. They skip silently without this variable, so running
      # them here is what stops that skip becoming permanent.
      - name: Test against a real database
        env:
          TEST_DATABASE_URL: postgres://bookworm:bookworm@localhost:5432/bookworm_ci
        run: npm test

      - name: Refuse to overwrite an existing account without the force flag
        env:
          SEED_EMAIL: other@example.test
          SEED_PASSWORD: another-throwaway-password
        run: |
          if npm run seed:user > /dev/null 2>&1; then
            echo 'seed:user overwrote an existing account without SEED_FORCE'; exit 1
          fi

      # A down migration nobody runs is a down migration that does not work.
      # Rolling the whole stack back and re-applying proves it before it is ever
      # needed on real data.
      - name: Roll back everything and re-apply
        run: |
          # Counted from the directory rather than hardcoded: a fixed number
          # here breaks on every new migration, which is noise rather than
          # signal.
          COUNT=$(ls -1 migrations/*.sql | wc -l | tr -d ' ')
          BEFORE=$(psql "$DATABASE_URL" -qtA -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename<>'pgmigrations';")

          npx node-pg-migrate down "$COUNT"

          psql "$DATABASE_URL" -qtA -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename<>'pgmigrations';" \
            | grep -qx '0' || { echo 'Full rollback left tables behind'; exit 1; }

          npx node-pg-migrate up

          AFTER=$(psql "$DATABASE_URL" -qtA -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename<>'pgmigrations';")
          [ "$BEFORE" = "$AFTER" ] \
            || { echo "Re-apply did not restore the schema: $BEFORE tables before, $AFTER after"; exit 1; }
